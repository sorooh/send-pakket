version: '3.8'

services:
  # Web Application
  web:
    build: .
    command: gunicorn sendpakket.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=sendpakket.settings_prod
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Database
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=sendpakket
      - POSTGRES_USER=sendpakket_user
      - POSTGRES_PASSWORD=change_this_password
    restart: unless-stopped

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build: .
    command: celery -A sendpakket worker -l info --concurrency=4
    volumes:
      - .:/app
    environment:
      - DEBUG=False
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Celery Beat (Scheduled Tasks)
  celery_beat:
    build: .
    command: celery -A sendpakket beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./ssl:/etc/ssl/certs
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: