app = "sendpakket-platform"
primary_region = "ams"  # Amsterdam region

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/paketo-buildpacks/python"]

[env]
  PORT = "8000"

[processes]
  web = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn sendpakket.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 4"
  worker = "celery -A sendpakket worker -l info --concurrency=2"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  processes = ["web"]

  [[services.ports]]
    handlers = ["http"]
    port = "80"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = "443"

[[services]]
  internal_port = 6379
  protocol = "tcp"
  processes = ["worker"]

[mounts]
  source = "sendpakket_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1